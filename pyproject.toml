[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-data-platform"
version = "0.1.0"
description = "Portfolio-grade fraud risk data engineering platform"
requires-python = ">=3.12"
dependencies = [
    "faker",
    "pydantic",
    "email-validator",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]